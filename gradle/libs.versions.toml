# Version catalog -- single source of truth for dependency versions.
# Versions verified against developer.android.com (AGP 9.4.0, Sept 2026):
#   AGP 9.4.0 requires Gradle 9.6.0 minimum/default, JDK 17, supports Kotlin 2.3, max API 37.

[versions]
agp = "9.4.0"
coreKtx = "1.19.0"
appcompat = "1.8.0"
activity = "1.13.0"
lifecycle = "2.11.0"
coroutines = "1.11.0"
junit = "4.13.2"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
# DataStore holds the access-mode preference and nothing else. 1.2.1 is current stable.
datastore = "1.2.1"
# Room stores the battery session domain. 2.8.4 is current stable.
room = "2.8.4"
# KSP must match the Kotlin the toolchain actually uses: AGP 9.4.0 builds with Kotlin 2.2.10.
ksp = "2.2.10-2.0.2"
# Robolectric runs the Room tests on the JVM, so CI exercises the real database.
robolectric = "4.16.1"
# Not a dependency we choose to use -- see the constraint in app/build.gradle.kts.
# DataStore 1.2.1 brings 1.7.3; Room 2.8.4's schema bundles need 1.8.x serializers.
kotlinxSerialization = "1.8.1"
# Shizuku: official project (github.com/RikkaApps/Shizuku). 13.1.5 is current stable.
shizuku = "13.1.5"
# Compose BOM pins every Compose artifact to one tested set.
composeBom = "2026.08.00"
activityCompose = "1.13.0"
lifecycleCompose = "2.11.0"
coroutinesTest = "1.11.0"
composeCompiler = "2.4.10"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

# Shizuku -- official API and provider. No root APIs, no Sui.
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }

# Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleCompose" }

# AGP 9.x supplies Kotlin itself; no Kotlin plugin entry belongs here.
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "composeCompiler" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
