# BattInsight CI.
#
# Deliberately absent: signing secrets, release publishing, and artifact upload to any
# external service. Those arrive with the release infrastructure phase, and never with an
# inherited key.

name: Android CI

on:
  push:
    # Feature branches are validated too, so work is checked before it reaches a
    # pull request rather than accumulating unverified.
    branches: [main, 'phase*/**', 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug

      # The release variant is built because CI once did not, and a broken release
      # toolchain survived undetected: the Compose compiler plugin was two Kotlin minor
      # versions ahead of AGP's built-in compiler and asked for a compose-group-mapping
      # artifact that was never published at that version. Every debug gate stayed green.
      # No signing configuration exists, so this produces an unsigned APK -- which is
      # exactly enough to exercise the release Compose toolchain, R8 and lintVitalRelease.
      - name: Assemble release (unsigned)
        run: ./gradlew --no-daemon assembleRelease

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # Lint is a gate: abortOnError is true, so a violation fails the job.
      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
