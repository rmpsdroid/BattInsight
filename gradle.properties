# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX only. No support-library jetifier.
android.useAndroidX=true
android.nonTransitiveRClass=true

org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

# KSP (Room's annotation processor) registers its generated sources through the
# kotlin.sourceSets DSL, which AGP 9's built-in Kotlin support disallows by default:
#
#   "Using kotlin.sourceSets DSL to add Kotlin sources is not allowed with built-in Kotlin"
#
# This flag is Android's own documented bridge for that situation
# (https://developer.android.com/r/tools/built-in-kotlin). It is set because KSP has not yet
# migrated to the android.sourceSets DSL, not because our own build scripts need it -- they
# do not use kotlin.sourceSets anywhere.
#
# Revisit when KSP supports AGP 9 natively; this should then be removable unchanged.
android.disallowKotlinSourceSets=false
